services:
  - type: web
    name: vibeload-api-isaacfirmino
    runtime: docker
    plan: free
    repo: https://github.com/IsaacFirmino/VibeLoad
    branch: main
    autoDeployTrigger: commit
    renderSubdomainPolicy: enabled
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://isaacfirmino.github.io,http://127.0.0.1:4173,http://localhost:4173
      - key: MAX_SOURCE_BYTES
        value: "262144000"
      - key: MAX_UPLOAD_BYTES
        value: "104857600"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: MAX_MEDIA_DURATION_SECONDS
        value: "7200"
      - key: DOWNLOAD_TIMEOUT_MS
        value: "600000"
      - key: JOB_TTL_MS
        value: "900000"
